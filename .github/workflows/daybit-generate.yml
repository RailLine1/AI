# Daybit 서버가 실행을 요청하면(workflow_dispatch) 내 구독 AI로 문제를 만들어 돌려줘요.
# 구독 토큰은 이 저장소의 Secret 에만 있고 Daybit 서버는 보지 않아요 (P-AI-09).
# Daybit 는 GitHub 가 발급한 OIDC 토큰으로 "이 저장소에서 온 요청"인지 확인해요.
name: Daybit 문제 생성

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Daybit 작업 id
        required: true
        type: string
      ai:
        description: 사용할 AI
        required: true
        type: choice
        options: [claudecode, codex]
      server:
        description: Daybit 서버 주소
        required: true
        type: string

permissions:
  id-token: write   # OIDC 토큰 발급
  contents: read

concurrency:
  group: daybit-${{ inputs.job_id }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: AI 도구 설치
        run: |
          if [ "${{ inputs.ai }}" = "claudecode" ]; then
            npm install -g @anthropic-ai/claude-code
          else
            npm install -g @openai/codex
          fi

      - name: Codex 로그인 정보 복원
        if: inputs.ai == 'codex'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          mkdir -p ~/.codex
          echo "$CODEX_AUTH_JSON" | base64 -d > ~/.codex/auth.json

      - name: 문제 만들기
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DAYBIT_JOB_ID: ${{ inputs.job_id }}
          DAYBIT_AI: ${{ inputs.ai }}
          DAYBIT_SERVER: ${{ inputs.server }}
        run: python3 scripts/run_job.py
